<!doctype html>
<!-- Social preview 1200×630 (Open Graph). Rendered by render-og.cjs from real interface captures in scr/. -->
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:Onest;src:url(../../apps/web/assets/fonts/onest-variable.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;background:#000;overflow:hidden}
body{position:relative;font-family:Onest,system-ui,sans-serif;color:#f4f4f5}
.glow{position:absolute;inset:0;background:radial-gradient(900px 520px at 78% 60%,rgba(255,255,255,.07),transparent 60%)}
.text{position:absolute;left:72px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.brand{font-size:40px;font-weight:600;letter-spacing:-1.5px}
.brand i{font-style:normal;color:#6ea8ff}
h1{font-size:56px;line-height:1.04;font-weight:600;letter-spacing:-2px}
p{font-size:24px;line-height:1.35;color:#a1a1aa;max-width:500px}
.url{font-size:19px;letter-spacing:3px;color:#71717a;text-transform:uppercase}
.phone{position:absolute;width:262px;height:538px;border-radius:44px;padding:9px;background:#111;box-shadow:0 0 0 1.5px #2a2a2e,0 40px 80px rgba(0,0,0,.6)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:36px;display:block}
.phone::after{content:'';position:absolute;left:50%;top:20px;width:76px;height:22px;margin-left:-38px;border-radius:12px;background:#000}
.p1{left:690px;top:92px;transform:rotate(-6deg)}
.p2{left:900px;top:46px;transform:rotate(5deg)}
</style></head>
<body><div class="glow"></div>
<div class="text">
  <div class="brand">сметра<i>.</i></div>
  <h1>Смета за минуты, согласование по ссылке</h1>
  <p>Позиции, объёмы и итоги, этапы и поступления. ИИ-ассистент собирает черновик по описанию.</p>
  <div class="url">smetra.online</div>
</div>
<div class="phone p1"><img src="scr/quote.png" alt=""></div>
<div class="phone p2"><img src="scr/assistant.png" alt=""></div>
</body></html>
