<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кабинет · Сметра</title><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="/">сметра<span class="brand-mark">.</span></a><div class="row"><span id="header-user" class="muted"></span><button class="btn small" id="theme">Тема</button></div></div></header><div id="auth" class="auth-wrap hidden"><div class="panel"><span class="eyebrow">Личный кабинет</span><h1 id="auth-title">Вход</h1><p class="muted">Предложения и согласования в одном месте.</p><form id="auth-form"><div class="field hidden" id="name-field"><label for="name">Ваше имя</label><input id="name" autocomplete="name" maxlength="80"></div><div class="field"><label for="email">Электронная почта</label><input type="email" id="email" autocomplete="email" required></div><div class="field"><label for="password">Пароль <small>от 12 символов при регистрации</small></label><input type="password" id="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%" id="auth-submit">Войти</button></form><p class="note"><button class="btn small" id="auth-switch" type="button">Создать аккаунт</button></p></div></div><div id="shell" class="app-shell hidden"><aside class="sidebar"><button data-tab="dashboard" class="active">Обзор</button><button data-tab="quotes">Предложения</button><button data-tab="billing">Тариф и оплата</button><button data-tab="support">Поддержка</button><button data-tab="settings">Настройки</button><button data-tab="admin" id="admin-nav" class="hidden">Админ</button><button id="logout" class="bottom">Выйти</button></aside><main class="main" id="content"></main></div><div id="toast" class="toast hidden" role="status"></div><script src="/app.js" defer></script></body></html>
