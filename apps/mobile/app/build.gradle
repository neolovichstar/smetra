plugins { id 'com.android.application' }

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.22'
        }
    }
}

def apiBase = providers.gradleProperty('apiBaseUrl').orElse('https://smetra.online').get()
def verifyUnsignedRelease = providers.gradleProperty('verifyUnsignedRelease').map { it == 'true' }.orElse(false).get()
def myTrackerSdkKey = providers.gradleProperty('myTrackerSdkKey').orElse(providers.environmentVariable('MYTRACKER_SDK_KEY')).orElse('').get()
def rustorePushProjectId = providers.gradleProperty('rustorePushProjectId').orElse(providers.environmentVariable('RUSTORE_PUSH_PROJECT_ID')).orElse('').get()
def localDebugApi = apiBase ==~ /http:\/\/(127\.0\.0\.1|10\.0\.2\.2)(:\d+)?/
if (!apiBase.startsWith('https://') && !localDebugApi) throw new GradleException('apiBaseUrl must use HTTPS (loopback is allowed for debug tests)')
if (rustorePushProjectId && !(rustorePushProjectId ==~ /[A-Za-z0-9_-]{8,128}/)) throw new GradleException('rustorePushProjectId must be a valid RuStore Push project id.')
android {
    namespace 'ru.smetra.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.smetra.mobile'
        minSdk 26
        targetSdk 35
        versionCode 42
        versionName '2.1.0'
        testInstrumentationRunner 'ru.smetra.mobile.DesignSmoke'
        buildConfigField 'String', 'API_BASE_URL', '"' + apiBase.replace('\"', '') + '"'
        buildConfigField 'String', 'MYTRACKER_SDK_KEY', '"' + myTrackerSdkKey.replace('\"', '') + '"'
        buildConfigField 'String', 'RUSTORE_PUSH_PROJECT_ID', '"' + rustorePushProjectId + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('SIGNING_STORE_FILE')) {
                storeFile file(System.getenv('SIGNING_STORE_FILE'))
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { }
        release {
            if (System.getenv('SIGNING_STORE_FILE')) signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        if (!apiBase.startsWith('https://')) throw new GradleException('Release requires an HTTPS API')
        if (apiBase.contains('example.invalid')) throw new GradleException('Set the real HTTPS production apiBaseUrl for a release.')
        if (!verifyUnsignedRelease) {
            ['SIGNING_STORE_FILE', 'SIGNING_STORE_PASSWORD', 'SIGNING_KEY_ALIAS', 'SIGNING_KEY_PASSWORD'].each { name ->
                if (!System.getenv(name)) throw new GradleException("Release signing credential ${name} is required.")
            }
            if (!file(System.getenv('SIGNING_STORE_FILE')).isFile()) throw new GradleException('Release signing keystore does not exist.')
        } else if (System.getenv('SIGNING_STORE_FILE')) {
            throw new GradleException('verifyUnsignedRelease is only for unsigned CI verification.')
        }
    }
}


dependencies {
    implementation 'com.my.tracker:mytracker-sdk:3.6.0'
    implementation 'com.yandex.android:mobileads:8.6.0'
    implementation 'ru.rustore.sdk:pushclient:7.5.0'
    // Hybrid shell: origin-restricted web messaging, Custom Tabs sign-in, FileProvider.
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core:1.13.1'
    // Optional AR measurements; the app runs without Google Play Services for AR.
    implementation 'com.google.ar:core:1.46.0'
    // Future native modules: CameraX, offline scanning, reliable background work,
    // biometric availability, safe document and photo metadata handling.
    // Keep versions explicit. Unused modules must not request runtime permissions.
    implementation 'androidx.camera:camera-core:1.5.3'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    // Fully on-device QR/barcode and Latin text recognition, no Google Play required.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
