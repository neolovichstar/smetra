version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:37'
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:42'
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: '04:47'
    open-pull-requests-limit: 5
