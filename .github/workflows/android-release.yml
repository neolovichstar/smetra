name: Android release
# Signed release APK with the existing RuStore key (never generated or changed here).
# Manual only; nothing is uploaded to RuStore.
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore the existing signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Add the ANDROID_KEYSTORE_BASE64 secret (base64 of the existing RuStore keystore)."; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/smetra-release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/smetra-release.jks" >> "$GITHUB_ENV"
      - name: Build and lint the release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MYTRACKER_SDK_KEY: ${{ secrets.MYTRACKER_SDK_KEY }}
          RUSTORE_PUSH_PROJECT_ID: ${{ secrets.RUSTORE_PUSH_PROJECT_ID }}
        run: bash apps/mobile/gradlew -p apps/mobile lintRelease assembleRelease -PapiBaseUrl=https://smetra.online
      - name: Verify package identity and signing certificate
        env:
          RUSTORE_CERT_SHA256: ${{ secrets.RUSTORE_CERT_SHA256 }}
        run: |
          APK=apps/mobile/app/build/outputs/apk/release/app-release.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/aapt" dump badging "$APK" | head -1 | tee badging.txt
          grep -q "name='ru.smetra.mobile'" badging.txt
          VERSION=$(grep -o "versionName='[^']*'" badging.txt | cut -d"'" -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ACTUAL=$("$TOOLS/apksigner" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest/{print toupper($2); exit}')
          EXPECTED=$(echo "$RUSTORE_CERT_SHA256" | tr -cd '0-9a-fA-F' | tr a-f A-F)
          test ${#EXPECTED} -eq 64 || { echo "Add the RUSTORE_CERT_SHA256 secret."; exit 1; }
          test "$ACTUAL" = "$EXPECTED" || { echo "Signing certificate differs from RuStore. Do not publish."; exit 1; }
          mkdir -p out && cp "$APK" "out/smetra-$VERSION-release.apk"
          sha256sum out/*.apk | tee out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: smetra-release-apk
          path: out
          retention-days: 90
      - name: Publish the signed APK to the android-release branch
        run: |
          cd out
          git init -q -b android-release
          git config user.name "smetra-ci"
          git config user.email "ci@smetra.online"
          git add -A
          git commit -qm "Signed release $VERSION (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-release
