name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: python -m compileall -q backend
      - run: pip install -r requirements-dev.txt
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements-dev.txt
      - run: pip-audit -r requirements-dev.txt -f cyclonedx-json -o python-sbom.json
      - run: python -m ruff check backend tests scripts
      - run: python -m unittest discover -s tests -v
      - name: Office preview DOM interactions
        run: |
          npm install --prefix data/dom --no-audit --no-fund jsdom@27.4.0
          node tests/assistant_markdown.cjs
          node tests/pwa_cache.cjs
          node tests/quote_money.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_api_transport.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_auth_capability.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_auth_session_races.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_billing_session_races.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_growth.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_office_files.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_navigation_races.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_history_editor_races.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_quote_review.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_quote_editor.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_select_menu.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_assistant_composer.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_settings_buttons.cjs
          SMETRA_JSDOM_MODULE="$PWD/data/dom/node_modules/jsdom" node tests/dom_app_actions.cjs
      - run: python scripts/build_web.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web
          path: dist/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-sbom
          path: python-sbom.json
      - name: Browser integration
        env:
          PORT: '8082'
          PUBLIC_ORIGIN: http://localhost:8082
          DB_PATH: /tmp/smetra-ci.sqlite3
        run: |
          mkdir -p data
          python backend/launcher.py > data/server.log 2>&1 &
          google-chrome --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9223 --user-data-dir=/tmp/smetra-chrome about:blank > data/chrome.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8082/health && curl -sf http://localhost:9223/json && break; sleep 1; done
          if ! curl -sf http://localhost:9223/json > /dev/null; then
            cat data/chrome.log
            exit 1
          fi
          node tests/browser_flows.cjs
          node tests/browser_quote_review.cjs
          node tests/browser_quote_editor.cjs
          node tests/browser_growth.cjs
          node tests/browser_pwa.cjs
          node tests/browser_construction_prices.cjs
      - name: Assistant preview, undo and conversation context in mobile browser
        run: |
          python scripts/android_ui_fixture.py > data/assistant-fixture.log 2>&1 &
          echo $! > data/assistant-fixture.pid
          for i in $(seq 1 30); do grep -Fq ANDROID_UI_FIXTURE_READY data/assistant-fixture.log && break; sleep 1; done
          grep -Fq ANDROID_UI_FIXTURE_READY data/assistant-fixture.log || { cat data/assistant-fixture.log; exit 1; }
          node tests/browser_assistant_studio.cjs
          node tests/browser_assistant_edits.cjs
          node tests/browser_receipts.cjs
          node tests/browser_scan_ocr.cjs
          node tests/browser_sections.cjs
          SMETRA_MIXED_PDF=1 node tests/browser_scan_ocr.cjs
      - name: Administrator revenue and pricing in mobile browser
        run: |
          SMETRA_ACTION_QA=1 SMETRA_FIXTURE_PORT=8096 python scripts/android_ui_fixture.py > data/revenue-fixture.log 2>&1 &
          task_revenue_pid=$!
          trap 'kill "$task_revenue_pid"' EXIT
          for i in $(seq 1 30); do grep -Fq ANDROID_UI_FIXTURE_READY data/revenue-fixture.log && break; sleep 1; done
          grep -Fq ANDROID_UI_FIXTURE_READY data/revenue-fixture.log || { cat data/revenue-fixture.log; exit 1; }
          SMETRA_TEST_PORT=8096 SMETRA_REVENUE_QA=1 node tests/browser_sections.cjs
      - name: Quote composition preview and reversal in mobile browser
        run: |
          kill "$(cat data/assistant-fixture.pid)"
          SMETRA_STRUCTURE_QA=1 python scripts/android_ui_fixture.py > data/structure-fixture.log 2>&1 &
          echo $! > data/assistant-fixture.pid
          for i in $(seq 1 30); do grep -Fq ANDROID_UI_FIXTURE_READY data/structure-fixture.log && break; sleep 1; done
          grep -Fq ANDROID_UI_FIXTURE_READY data/structure-fixture.log || { cat data/structure-fixture.log; exit 1; }
          node tests/browser_quote_structure.cjs
      - name: Assistant documents and file metadata in mobile browser
        run: |
          kill "$(cat data/assistant-fixture.pid)"
          SMETRA_RESOURCE_QA=1 python scripts/android_ui_fixture.py > data/resources-fixture.log 2>&1 &
          echo $! > data/assistant-fixture.pid
          for i in $(seq 1 30); do grep -Fq ANDROID_UI_FIXTURE_READY data/resources-fixture.log && break; sleep 1; done
          grep -Fq ANDROID_UI_FIXTURE_READY data/resources-fixture.log || { cat data/resources-fixture.log; exit 1; }
          node tests/browser_assistant_resources.cjs
      - name: DOCX, XLSX and CSV preview in mobile and desktop browser
        run: |
          kill "$(cat data/assistant-fixture.pid)"
          SMETRA_OFFICE_QA=1 python scripts/android_ui_fixture.py > data/office-fixture.log 2>&1 &
          for i in $(seq 1 30); do grep -Fq ANDROID_UI_FIXTURE_READY data/office-fixture.log && break; sleep 1; done
          grep -Fq ANDROID_UI_FIXTURE_READY data/office-fixture.log || { cat data/office-fixture.log; exit 1; }
          node tests/browser_office_files.cjs
      - name: Browser fixture diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-fixture-logs
          path: |
            data/*.log
            data/office-*.png
            data/assistant-studio-*.png
            data/qa/section-*.png
            data/qa/growth-*.png
            data/qa/quote-review-*.png
            data/qa/quote-editor-*.png
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Native session isolation under delayed work
        run: |
          javac -d data/native-session-tests apps/mobile/app/src/main/java/ru/smetra/mobile/NativeSessionWork.java tests/NativeSessionWorkTest.java
          java -cp data/native-session-tests ru.smetra.mobile.NativeSessionWorkTest
          javac -d data/native-session-tests apps/mobile/app/src/main/java/ru/smetra/mobile/NativeImageSize.java tests/NativeImageSizeTest.java
          java -cp data/native-session-tests ru.smetra.mobile.NativeImageSizeTest
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'
      - run: bash apps/mobile/gradlew -p apps/mobile assembleDebug lintDebug -PapiBaseUrl=https://example.invalid
      - run: bash apps/mobile/gradlew -p apps/mobile assembleRelease lintRelease -PapiBaseUrl=https://smetra.vercel.app -PverifyUnsignedRelease=true
      - name: Read Android version
        id: android-version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p' apps/mobile/app/build.gradle | head -n1)"
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*$/\1/p" apps/mobile/app/build.gradle | head -n1)"
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: Verify debug APK identity and checksum
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ steps.android-version.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ steps.android-version.outputs.version_name }}
        run: |
          set -euo pipefail
          APK="apps/mobile/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "name='ru.smetra.mobile' versionCode='${EXPECTED_VERSION_CODE}' versionName='${EXPECTED_VERSION_NAME}'" >/dev/null
          sha256sum "$APK" | awk '{ name=$2; sub(/^.*\//,"",name); print $1 "  " name }' > "$APK.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smetra-mobile-${{ steps.android-version.outputs.version_name }}-${{ steps.android-version.outputs.version_code }}-debug
          path: |
            apps/mobile/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 14
