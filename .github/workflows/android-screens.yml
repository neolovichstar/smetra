name: Android screens
# Real screenshots of the debug APK in an emulator against the isolated fixture,
# start-up metrics, the UI critic and the RuStore promo images. Never publishes.
on:
  workflow_dispatch:
  push:
    branches: [claude/android-hybrid-shell]
    paths:
      - apps/mobile/**
      - apps/web/**
      - scripts/android_*
      - scripts/rustore_promo.py
      - .github/workflows/android-screens.yml
concurrency:
  group: android-screens-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: pip install -r requirements-dev.txt
      - name: Build debug APK for the emulator fixture
        run: |
          # Installable test build against production, published with the screens.
          bash apps/mobile/gradlew -p apps/mobile assembleDebug -PapiBaseUrl=https://smetra.online
          mkdir -p data/apk && cp apps/mobile/app/build/outputs/apk/debug/app-debug.apk data/apk/smetra-2.0.0-debug.apk
          bash apps/mobile/gradlew -p apps/mobile assembleDebug -PapiBaseUrl=http://10.0.2.2:8090
          # Free the runner's memory for the emulator: the Gradle daemons are not needed any more.
          bash apps/mobile/gradlew -p apps/mobile --stop
          pkill -f KotlinCompileDaemon || true
      - name: Start isolated fixture
        run: |
          mkdir -p data
          SMETRA_PROMO_QA=1 SMETRA_FIXTURE_PORT=8090 SMETRA_FIXTURE_ORIGIN=http://10.0.2.2:8090 \
            SMETRA_FIXTURE_SESSION_FILE=data/promo-session python scripts/android_ui_fixture.py > data/promo-fixture.log 2>&1 &
          for i in $(seq 1 60); do grep -Fq ANDROID_UI_FIXTURE_READY data/promo-fixture.log && break; sleep 1; done
          grep -Fq ANDROID_UI_FIXTURE_READY data/promo-fixture.log || { cat data/promo-fixture.log; exit 1; }
          # Same data for the browser capture, served on its own localhost origin.
          SMETRA_PROMO_QA=1 SMETRA_FIXTURE_PORT=8091 SMETRA_FIXTURE_SESSION_FILE=data/promo-session-local \
            python scripts/android_ui_fixture.py > data/promo-fixture-local.log 2>&1 &
          for i in $(seq 1 60); do grep -Fq ANDROID_UI_FIXTURE_READY data/promo-fixture-local.log && break; sleep 1; done
          grep -Fq ANDROID_UI_FIXTURE_READY data/promo-fixture-local.log || { cat data/promo-fixture-local.log; exit 1; }
      - name: Capture screens at phone resolution (headless Chrome)
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9230 --user-data-dir=/tmp/smetra-screens about:blank > data/chrome-screens.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9230/json/version > /dev/null && break; sleep 1; done
          SMETRA_CDP=http://127.0.0.1:9230 SMETRA_ORIGIN=http://localhost:8091 SMETRA_SESSION=$(cat data/promo-session-local) \
            SMETRA_SCREENS_DIR=data/android-screens node scripts/android_screens.cjs
      - name: Enable KVM and swap
        continue-on-error: true
        run: |
          free -m
          sudo fallocate -l 6G /mnt/emulator.swap && sudo chmod 600 /mnt/emulator.swap && sudo mkswap /mnt/emulator.swap && sudo swapon /mnt/emulator.swap || true
          free -m
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native start-up metrics in the emulator (best effort)
        id: native
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMETRA_ORIGIN: http://10.0.2.2:8090
          SMETRA_SCREEN_IDS: '01'
          SMETRA_SCREENS_DIR: data/android-native
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          cores: 2
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: SMETRA_SESSION=$(cat data/promo-session) bash scripts/android_emulator_screens.sh
      - name: Host diagnostics
        if: steps.native.outcome == 'failure'
        run: |
          free -m
          sudo dmesg -T | grep -i -E "oom|killed|qemu|emulator|segfault|kvm" | tail -30 || true
          ls -la ~/.android/avd/*.avd/ 2>/dev/null | head -20
          tail -50 ~/.android/avd/*.avd/*.log 2>/dev/null || true
          df -h / /mnt
      - name: Promo images, manifest and UI critic
        run: |
          cp data/android-native/metrics-native.json data/android-screens/ 2>/dev/null || true
          python scripts/rustore_promo.py data/android-screens
          cat data/android-screens/ui-critic.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: |
            data/android-screens
            data/promo-fixture.log
          retention-days: 30
      - name: Publish screens to the android-screens branch
        # Partial captures and logcat are published too, so failures can be diagnosed.
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          [ -d data/android-screens ] || exit 0
          cp data/promo-fixture.log data/android-screens/ 2>/dev/null || true
          cp -r data/apk data/android-screens/ 2>/dev/null || true
          cd data/android-screens
          git init -q -b android-screens
          git config user.name "smetra-ci"
          git config user.email "ci@smetra.online"
          git add -A
          git commit -qm "Android screens for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-screens
